name: Benchmark SSR App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        type: environment
      target:
        description: Target framework VPS
        required: true
        type: choice
        options:
          - next
          - nuxt
          - svelte
      service:
        description: Benchmark target service
        required: true
        type: choice
        options:
          - landing
          - catalog
      url:
        description: Full URL to benchmark
        required: true
        type: string
      lighthouse_runs:
        description: Number of Lighthouse runs
        required: true
        default: "3"
        type: string
      k6_script:
        description: k6 script file
        required: true
        type: choice
        options:
          - k6/landing.js
          - k6/catalog.js
          - k6/stress.js
      k6_env_flags:
        description: "Extra k6 ENV vars (e.g. MODE=catalog STEP6_TARGET=700)"
        required: false
        default: ""
        type: string

run-name: "Benchmark ${{ inputs.target }}/${{ inputs.service }} by @${{ github.actor }}"

concurrency:
  group: benchmark-${{ inputs.target }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show selected inputs
        run: |
          echo "environment=${{ inputs.environment }}"
          echo "target=${{ inputs.target }}"
          echo "service=${{ inputs.service }}"
          echo "url=${{ inputs.url }}"
          echo "lighthouse_runs=${{ inputs.lighthouse_runs }}"
          echo "k6_script=${{ inputs.k6_script }}"
          echo "k6_env_flags=${{ inputs.k6_env_flags }}"

      - name: Setup SSH
        run: |
          mkdir -p $HOME/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> $HOME/.ssh/known_hosts
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key

      - name: Switch active service on VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_KEY_PATH: /home/runner/.ssh/deploy_key
        run: |
          python scripts/switch_service.py \
            --target "${{ inputs.target }}" \
            --service "${{ inputs.service }}"

      - name: Healthcheck before benchmark
        run: |
          python scripts/healthcheck.py \
            --url "${{ inputs.url }}" \
            --attempts 15 \
            --delay 5 \
            --timeout 10

      # ── Lighthouse mobile ─────────────────────────────────────────────────
      - name: Clean Lighthouse output
        run: rm -rf .lighthouseci

      - name: Run Lighthouse CI (mobile)
        id: lighthouse_mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.url }}
          runs: ${{ inputs.lighthouse_runs }}
          uploadArtifacts: false
          temporaryPublicStorage: false
          configPath: ./lighthouse/configs/${{ inputs.service }}/lighthouserc.json

      - name: Archive mobile results
        if: always()
        run: |
          mkdir -p results/lighthouse/mobile
          [ -d .lighthouseci ] && cp -R .lighthouseci/. results/lighthouse/mobile/

      - name: Upload Lighthouse mobile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lh-mobile-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/lighthouse/mobile/
          if-no-files-found: warn

      # ── Lighthouse desktop ────────────────────────────────────────────────
      - name: Clean Lighthouse output
        run: rm -rf .lighthouseci

      - name: Run Lighthouse CI (desktop)
        id: lighthouse_desktop
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.url }}
          runs: ${{ inputs.lighthouse_runs }}
          uploadArtifacts: false
          temporaryPublicStorage: false
          configPath: ./lighthouse/configs/${{ inputs.service }}/lighthouserc-desktop.json

      - name: Archive desktop results
        if: always()
        run: |
          mkdir -p results/lighthouse/desktop
          [ -d .lighthouseci ] && cp -R .lighthouseci/. results/lighthouse/desktop/

      - name: Upload Lighthouse desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lh-desktop-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/lighthouse/desktop/
          if-no-files-found: warn

      # ── Lighthouse summary ────────────────────────────────────────────────
      - name: Print Lighthouse summary (mobile)
        if: always()
        run: |
          if [ -f results/lighthouse/mobile/assertion-results.json ]; then
            python scripts/lhci_summary.py \
              --results results/lighthouse/mobile/assertion-results.json \
              --target "${{ inputs.target }}" \
              --service "${{ inputs.service }}-mobile" || true
          else
            echo "No mobile assertion-results.json found"
          fi

      - name: Print Lighthouse summary (desktop)
        if: always()
        run: |
          if [ -f results/lighthouse/desktop/assertion-results.json ]; then
            python scripts/lhci_summary.py \
              --results results/lighthouse/desktop/assertion-results.json \
              --target "${{ inputs.target }}" \
              --service "${{ inputs.service }}-desktop" || true
          else
            echo "No desktop assertion-results.json found"
          fi

      # ── k6 ────────────────────────────────────────────────────────────────
      - name: Prepare k6 results directory
        run: mkdir -p results/k6

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 benchmark
        env:
          BASE_URL: ${{ inputs.url }}
          K6_ENV_FLAGS: ${{ inputs.k6_env_flags }}
        run: |
          K6_ENV_ARGS="-e BASE_URL=$BASE_URL"
          if [ -n "$K6_ENV_FLAGS" ]; then
            for pair in $K6_ENV_FLAGS; do
              K6_ENV_ARGS="$K6_ENV_ARGS -e $pair"
            done
          fi
          k6 run $K6_ENV_ARGS \
            --out json=results/k6/results.json \
            --summary-export=results/k6/summary.json \
            ${{ inputs.k6_script }}

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/k6/
          if-no-files-found: warn

      # ── Metadata ──────────────────────────────────────────────────────────
      - name: Save benchmark metadata
        if: always()
        run: |
          mkdir -p results/meta
          cat <<EOF > results/meta/run-info.json
          {
            "environment": "${{ inputs.environment }}",
            "target": "${{ inputs.target }}",
            "service": "${{ inputs.service }}",
            "url": "${{ inputs.url }}",
            "lighthouse_runs": "${{ inputs.lighthouse_runs }}",
            "k6_script": "${{ inputs.k6_script }}",
            "k6_env_flags": "${{ inputs.k6_env_flags }}",
            "actor": "${{ github.actor }}",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/meta/
          if-no-files-found: warn
