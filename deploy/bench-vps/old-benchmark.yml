name: Benchmark SSR App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        type: environment
      target:
        description: Target framework VPS
        required: true
        type: choice
        options:
          - next
          - nuxt
          - svelte
      service:
        description: Benchmark target service
        required: true
        type: choice
        options:
          - landing
          - catalog
      url:
        description: Full URL to benchmark
        required: true
        type: string
      lighthouse_runs:
        description: Number of Lighthouse runs
        required: true
        default: "3"
        type: string
      k6_script:
        description: k6 script file
        required: true
        type: choice
        options:
          - k6/landing.js
          - k6/catalog.js
          - k6/stress.js
      k6_env_flags:
        description: "Extra k6 ENV vars (e.g. RATE=30 DURATION=5m or MODE=catalog STEP6_TARGET=700)"
        required: false
        default: ""
        type: string

run-name: "Benchmark ${{ inputs.target }}/${{ inputs.service }} by @${{ github.actor }}"

concurrency:
  group: benchmark-${{ inputs.target }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show selected inputs
        run: |
          echo "environment=${{ inputs.environment }}"
          echo "target=${{ inputs.target }}"
          echo "service=${{ inputs.service }}"
          echo "url=${{ inputs.url }}"
          echo "lighthouse_runs=${{ inputs.lighthouse_runs }}"
          echo "k6_script=${{ inputs.k6_script }}"
          echo "k6_env_flags=${{ inputs.k6_env_flags }}"

      - name: Setup SSH
        run: |
          mkdir -p $HOME/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> $HOME/.ssh/known_hosts
          ssh-keyscan -p ${{ secrets.BENCH_SSH_PORT }} ${{ secrets.BENCH_SSH_HOST }} >> $HOME/.ssh/known_hosts
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key

      - name: Switch active service on framework VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_KEY_PATH: /home/runner/.ssh/deploy_key
        run: |
          python scripts/switch_service.py \
            --target "${{ inputs.target }}" \
            --service "${{ inputs.service }}"

      - name: Healthcheck before benchmark
        run: |
          python scripts/healthcheck.py \
            --url "${{ inputs.url }}" \
            --attempts 15 \
            --delay 5 \
            --timeout 10

      - name: Clean previous Lighthouse results
        run: rm -rf .lighthouseci

      - name: Run Lighthouse CI (mobile)
        id: lighthouse_mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.url }}
          runs: ${{ inputs.lighthouse_runs }}
          uploadArtifacts: false
          temporaryPublicStorage: false
          configPath: ./lighthouse/configs/${{ inputs.service }}/lighthouserc.json

      - name: Archive Lighthouse mobile results
        if: always()
        run: |
          mkdir -p results/lighthouse/mobile
          if [ -d .lighthouseci ]; then
            cp -R .lighthouseci/. results/lighthouse/mobile/
          fi

      - name: Upload Lighthouse mobile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/lighthouse/mobile/
          if-no-files-found: warn

      - name: Clean before desktop Lighthouse
        run: rm -rf .lighthouseci

      - name: Run Lighthouse CI (desktop)
        id: lighthouse_desktop
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.url }}
          runs: ${{ inputs.lighthouse_runs }}
          uploadArtifacts: false
          temporaryPublicStorage: false
          configPath: ./lighthouse/configs/${{ inputs.service }}/lighthouserc-desktop.json

      - name: Archive Lighthouse desktop results
        if: always()
        run: |
          mkdir -p results/lighthouse/desktop
          if [ -d .lighthouseci ]; then
            cp -R .lighthouseci/. results/lighthouse/desktop/
          fi

      - name: Upload Lighthouse desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/lighthouse/desktop/
          if-no-files-found: warn

      - name: Print Lighthouse summary (mobile)
        if: always()
        run: |
          if [ -f results/lighthouse/mobile/assertion-results.json ]; then
            python scripts/lhci_summary.py \
              --results results/lighthouse/mobile/assertion-results.json \
              --target "${{ inputs.target }}" \
              --service "${{ inputs.service }}-mobile"
          else
            echo "No mobile assertion-results.json found"
          fi

      - name: Print Lighthouse summary (desktop)
        if: always()
        run: |
          if [ -f results/lighthouse/desktop/assertion-results.json ]; then
            python scripts/lhci_summary.py \
              --results results/lighthouse/desktop/assertion-results.json \
              --target "${{ inputs.target }}" \
              --service "${{ inputs.service }}-desktop"
          else
            echo "No desktop assertion-results.json found"
          fi

      - name: Prepare local results directories
        run: |
          mkdir -p results/k6
          mkdir -p results/meta

      - name: Upload k6 scripts to bench server
        run: |
          ssh -i $HOME/.ssh/deploy_key \
            -p ${{ secrets.BENCH_SSH_PORT }} \
            ${{ secrets.BENCH_SSH_USER }}@${{ secrets.BENCH_SSH_HOST }} \
            "mkdir -p /opt/bench/k6 /opt/bench/results && rm -f /opt/bench/results/results.json /opt/bench/results/summary.json"

          scp -i $HOME/.ssh/deploy_key \
            -P ${{ secrets.BENCH_SSH_PORT }} \
            k6/*.js \
            ${{ secrets.BENCH_SSH_USER }}@${{ secrets.BENCH_SSH_HOST }}:/opt/bench/k6/

      - name: Run k6 on bench server
        run: |
          K6_ENV_ARGS="-e BASE_URL=${{ inputs.url }}"
          if [ -n "${{ inputs.k6_env_flags }}" ]; then
            for pair in ${{ inputs.k6_env_flags }}; do
              K6_ENV_ARGS="$K6_ENV_ARGS -e $pair"
            done
          fi

          ssh -i $HOME/.ssh/deploy_key \
            -p ${{ secrets.BENCH_SSH_PORT }} \
            ${{ secrets.BENCH_SSH_USER }}@${{ secrets.BENCH_SSH_HOST }} \
            "cd /opt/bench && k6 run $K6_ENV_ARGS \
              --out json=/opt/bench/results/results.json \
              --summary-export=/opt/bench/results/summary.json \
              /opt/bench/${{ inputs.k6_script }}"

      - name: Fetch k6 results from bench server
        if: always()
        run: |
          scp -i $HOME/.ssh/deploy_key \
            -P ${{ secrets.BENCH_SSH_PORT }} \
            ${{ secrets.BENCH_SSH_USER }}@${{ secrets.BENCH_SSH_HOST }}:/opt/bench/results/results.json \
            results/k6/results.json || true

          scp -i $HOME/.ssh/deploy_key \
            -P ${{ secrets.BENCH_SSH_PORT }} \
            ${{ secrets.BENCH_SSH_USER }}@${{ secrets.BENCH_SSH_HOST }}:/opt/bench/results/summary.json \
            results/k6/summary.json || true

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/k6/
          if-no-files-found: warn

      - name: Save benchmark metadata
        if: always()
        run: |
          cat <<EOF > results/meta/run-info.json
          {
            "environment": "${{ inputs.environment }}",
            "target": "${{ inputs.target }}",
            "service": "${{ inputs.service }}",
            "url": "${{ inputs.url }}",
            "lighthouse_runs": "${{ inputs.lighthouse_runs }}",
            "k6_script": "${{ inputs.k6_script }}",
            "k6_env_flags": "${{ inputs.k6_env_flags }}",
            "framework_ssh_host": "${{ secrets.SSH_HOST }}",
            "bench_ssh_host": "${{ secrets.BENCH_SSH_HOST }}",
            "actor": "${{ github.actor }}",
            "sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload benchmark metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-meta-${{ inputs.target }}-${{ inputs.service }}-${{ github.run_id }}
          path: results/meta/
          if-no-files-found: warn
